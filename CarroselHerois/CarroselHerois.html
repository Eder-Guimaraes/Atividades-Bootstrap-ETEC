<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Bootstrap CSS -->
	<link href="../css/bootstrap.min.css" rel="stylesheet">
	<title>Carrossel Heróis Marvel</title>

	<style>
		body {
			background: radial-gradient(circle at top, #2b0d14 0%, #0d0d12 60%, #000000 100%);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 3rem;
			font-family: Arial, Helvetica, sans-serif;
		}

		.page-title {
			color: #ffffff;
			text-align: center;
			font-weight: 700;
			letter-spacing: 1px;
			margin-bottom: 2rem;
			text-shadow: 0 0 12px rgba(237, 28, 36, 0.6);
		}

		.carousel-wrapper {
			width: 100%;
			max-width: 500px;
			margin: 0 auto;
		}

		.carousel-inner .carousel-item img {
			height: 320px;
			width: 100%;
			object-fit: cover;
			object-position: top center;
			border-radius: 6px;
		}

		#controle {
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
			border-radius: 6px;
			overflow: hidden;
		}

		.carousel-caption {
			background: rgba(0, 0, 0, 0.55);
			border-radius: 4px;
			bottom: 10px;
		}
	</style>
</head>
<body>

	<h1 class="page-title">Heróis Marvel</h1>

	<div class="carousel-wrapper">
		<div id="controle" class="carousel slide" data-ride="carousel">
			<ol class="carousel-indicators">
				<li data-target="#controle" data-slide-to="0" class="active"></li>
				<li data-target="#controle" data-slide-to="1"></li>
				<li data-target="#controle" data-slide-to="2"></li>
				<li data-target="#controle" data-slide-to="3"></li>
				<li data-target="#controle" data-slide-to="4"></li>
			</ol>
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img class="d-block w-100" src="Images/Homem_Ferro.webp" alt="Homem de Ferro">
					<div class="carousel-caption d-none d-md-block">
						<h3>Homem de Ferro</h3>
						<p>Tony Stark</p>
					</div>
				</div>
				<div class="carousel-item">
					<img class="d-block w-100" src="Images/Capitao_America.webp" alt="Capitão América">
					<div class="carousel-caption d-none d-md-block">
						<h3>Capitão América</h3>
						<p>Steve Rogers</p>
					</div>
				</div>
				<div class="carousel-item">
					<img class="d-block w-100" src="Images/Homem_Aranha.webp" alt="Homem-Aranha">
					<div class="carousel-caption d-none d-md-block">
						<h3>Homem-Aranha</h3>
						<p>Peter Parker</p>
					</div>
				</div>
				<div class="carousel-item">
					<img class="d-block w-100" src="Images/Thor.webp" alt="Thor">
					<div class="carousel-caption d-none d-md-block">
						<h3>Thor</h3>
						<p>Thor Odinson</p>
					</div>
				</div>
				<div class="carousel-item">
					<img class="d-block w-100" src="Images/Pantera_Negra.webp" alt="Pantera Negra">
					<div class="carousel-caption d-none d-md-block">
						<h3>Pantera Negra</h3>
						<p>T'Challa</p>
					</div>
				</div>
			</div>
			<a href="#controle" class="carousel-control-prev" role="button" data-slide="prev">
				<span class="carousel-control-prev-icon"></span>
			</a>
			<a href="#controle" class="carousel-control-next" role="button" data-slide="next">
				<span class="carousel-control-next-icon"></span>
			</a>
		</div>
	</div>

	<!-- jQuery, Popper.js, Bootstrap JS -->
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
	<script src="../js/bootstrap.min.js"></script>
	<script>
		$('.carousel').carousel({
			interval: 2000
		})
	</script>
</body>
</html>
